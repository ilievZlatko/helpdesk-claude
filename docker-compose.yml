services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
      POSTGRES_DB: helpdesk
    ports:
      # Host port 5433 avoids clashing with other local Postgres instances on 5432.
      - '5433:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/,
      # so the volume is mounted at the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U helpdesk -d helpdesk']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
