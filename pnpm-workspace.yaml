packages:
  - 'apps/*'
  - 'packages/*'

# Shared dependency versions. Reference them from a package.json as "catalog:".
catalog:
  # TypeScript 7 ships without a JS API, which the NestJS CLI/schematics and
  # type-aware tooling still need. Stay on 6.x until they support 7.
  typescript: ~6.0.3
  '@types/node': ^24.0.0
  zod: ^4.6.7
  vite: ^8.0.0
  vitest: ^5.1.2
  '@vitest/coverage-v8': ^5.1.2
  oxlint: ^1.90.0
  prettier: ^3.10.1
  turbo: ^2.11.13
  better-auth: ^1.7.28

# Dependencies allowed to run install scripts (pnpm 11 blocks unreviewed ones).
allowBuilds:
  # Downloads the Prisma schema engine used by `prisma migrate`.
  '@prisma/engines': true
  # Not needed: its postinstall only verifies or downloads the platform binary,
  # which pnpm already installs as an optional dependency (used by tsx).
  esbuild: false
  # Preinstall checks Node/TypeScript compatibility.
  prisma: true
